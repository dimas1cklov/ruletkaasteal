<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Steal an Egg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0E1128}
body{display:flex;justify-content:center;font-family:'Nunito',system-ui,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
button{font:inherit}
.app{width:390px;max-width:100vw;height:844px;position:relative;overflow:hidden;background:#55BBFF}

/* ===== animations ===== */
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
@keyframes twinkle{0%,100%{transform:scale(.7) rotate(45deg);opacity:.55}50%{transform:scale(1.1) rotate(45deg);opacity:1}}
@keyframes spinslow{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.float{animation:float 4.2s ease-in-out infinite}
.sway{animation:sway 3.8s ease-in-out infinite;transform-origin:50% 100%}
.drift{animation:drift 7s ease-in-out infinite}
.twinkle{animation:twinkle 2.4s ease-in-out infinite}
.spinslow{animation:spinslow 24s linear infinite}
.breathe{animation:breathe 2.2s ease-in-out infinite}

/* ===== background ===== */
.bg{position:absolute;inset:0;pointer-events:none;filter:blur(3.5px) saturate(1.05);transform:scale(1.04)}
.bg .a{position:absolute}
.cloud div{position:absolute;background:#fff;border-radius:4px}
.studs{background:radial-gradient(circle at 12px 12px,rgba(255,255,255,.34) 0 5px,rgba(0,0,0,.10) 6px 7px,transparent 8px) 0 0/24px 24px,repeating-conic-gradient(#5BD15E 0 25%,#F2C230 0 50%) 0 0/96px 96px}
.plate{height:16px;border:3px solid #0E1128;border-radius:4px}
.gold{background:radial-gradient(circle at 10px 10px,rgba(255,255,255,.4) 0 4px,transparent 5px) 0 0/20px 20px,#F2C230}
.purple{background:radial-gradient(circle at 10px 10px,rgba(255,255,255,.35) 0 4px,transparent 5px) 0 0/20px 20px,#9B5BFF}
.blue{background:radial-gradient(circle at 10px 10px,rgba(255,255,255,.4) 0 4px,transparent 5px) 0 0/20px 20px,#4FC3F7}
.stone{background:radial-gradient(circle at 10px 10px,rgba(255,255,255,.3) 0 4px,transparent 5px) 0 0/20px 20px,#8C93B8}
.egg-shadow{filter:drop-shadow(0 6px 0 rgba(14,17,40,.35))}
.trunk{position:absolute;background:#8A5A2B;border:3px solid #0E1128}
.leaves{position:absolute;background:#3CB043;border:3px solid #0E1128;border-radius:6px}
.dim{position:absolute;inset:0;background:rgba(14,17,40,.22);pointer-events:none}

/* ===== UI ===== */
.ui{position:relative;height:100%;padding:40px 16px 24px;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;justify-content:space-between;gap:8px}
.chip{display:flex;gap:6px;background:#1B1F3B;border:3px solid #0E1128;border-radius:10px;padding:6px 10px;font-weight:900;font-size:14px}
.chip .k{color:#9FB0FF}
.titlewrap{text-align:center}
.logo{position:relative;display:inline-block;margin:0;font-weight:400;font-family:'Luckiest Guy',cursive;line-height:.95;letter-spacing:1px;transform:rotate(-3deg)}
.logobtn{display:block;margin:0 auto;padding:0;border:0;background:none;color:inherit;cursor:pointer;font-family:inherit;transition:transform .1s}
.logobtn:active{transform:scale(.95)}
.logo .line{position:relative;display:block}
.logo .back{display:block;color:#0E1128;-webkit-text-stroke:12px #0E1128;text-shadow:0 8px 0 #0E1128}
.logo .front{position:absolute;inset:0;-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .l1{font-size:38px}
.logo .l1 .front{background-image:linear-gradient(180deg,#fff 0%,#fff 45%,#BFE6FF 100%)}
.logo .l2{font-size:76px;margin-top:-2px}
.logo .l2 .front{background-image:linear-gradient(180deg,#FFF6A0 0%,#FFD83A 45%,#FF9F1C 100%)}
.subtitle{margin:10px 0 0;font-weight:900;font-size:15px;text-shadow:0 2px 0 #0E1128,2px 0 0 #0E1128,-2px 0 0 #0E1128,0 -2px 0 #0E1128}

.panel{background:#1B1F3B;border:4px solid #0E1128;border-radius:18px;padding:8px;box-shadow:0 8px 0 #0E1128,0 0 40px rgba(255,225,77,.35);margin:30px -12px 0}
.window{position:relative;width:358px;height:184px;overflow:hidden;border-radius:10px;background:#12152C}
.strip{position:absolute;left:0;top:12px;display:flex;gap:8px;will-change:transform}
.card{flex:0 0 116px;width:116px;height:160px;border-radius:12px;background:#262B52;border:3px solid;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 6px 12px}
.card .pic{height:92px;width:104px;display:flex;align-items:center;justify-content:center}
.card .pic img{max-width:104px;max-height:92px;object-fit:contain}
.card .name{font-size:13px;line-height:1.15;font-weight:800;text-align:center}
.card .rar{font-size:11px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;text-align:center;margin-top:2px}
.needle{position:absolute;left:177px;top:0;bottom:0;width:4px;background:#FFE14D;opacity:.9;box-shadow:0 0 10px #FFE14D}
.tri{position:absolute;left:165px;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent}
.tri.top{top:-2px;border-top:20px solid #FFE14D}
.tri.bot{bottom:-2px;border-bottom:20px solid #FFE14D}

.history{background:#1B1F3B;border:4px solid #0E1128;border-radius:14px;padding:10px 12px;margin-top:4px}
.history h2{margin:0 0 8px;font-size:12px;font-weight:900;color:#9FB0FF;text-transform:uppercase;letter-spacing:.6px}
.history .empty{font-size:13px;font-weight:800;color:#C9D2FF}
.hlist{display:flex;flex-wrap:wrap;gap:6px}
.hitem{display:flex;align-items:center;gap:6px;background:#262B52;border:2px solid;border-radius:8px;padding:3px 8px 3px 4px;font-size:12px;font-weight:800}
.hitem img{width:22px;height:22px;object-fit:contain}

/* ===== gen-alpha buttons ===== */
@keyframes shine{0%,55%{left:-45%}100%{left:135%}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes hue{to{background-position:300% 0}}
@keyframes glowy{0%,100%{box-shadow:0 8px 0 #0E1128,0 0 0 0 rgba(255,201,60,0)}50%{box-shadow:0 8px 0 #0E1128,0 0 30px 8px rgba(255,201,60,.9)}}
@keyframes popIn{0%{transform:scale(.4)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.gbtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:0 16px;border:4px solid #0E1128;border-radius:20px;color:#fff;font-family:'Luckiest Guy','Russo One',sans-serif;letter-spacing:1.5px;line-height:1;-webkit-text-stroke:1.5px #0E1128;text-shadow:0 4px 0 #0E1128;box-shadow:0 8px 0 #0E1128;text-decoration:none;cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s,color .15s}
.gbtn .t,.gbtn svg{position:relative;z-index:2}
.gbtn .t{padding-top:5px}
.gbtn::before{content:'';position:absolute;left:10px;right:10px;top:5px;height:36%;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.1));z-index:1;pointer-events:none}
.gbtn::after{content:'';position:absolute;top:-20%;bottom:-20%;left:-45%;width:28%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.7),rgba(255,255,255,0));transform:skewX(-20deg);animation:shine 2.8s ease-in-out infinite;z-index:1;pointer-events:none}
.gbtn:hover{filter:brightness(1.08) saturate(1.15)}
.gbtn:active{transform:translateY(6px)!important;box-shadow:0 2px 0 #0E1128!important}
.gbtn:disabled{cursor:default;filter:grayscale(.55) brightness(.85);animation:none}
.gbtn:disabled::after{animation:none;opacity:0}
.g-green{background:linear-gradient(180deg,#A6FF66 0%,#3BD15A 55%,#1FA03A 100%)}
.g-purple{background:linear-gradient(90deg,#7A5CFF,#FF4FD8,#4FC3F7,#7A5CFF);background-size:300% 100%;animation:hue 4s linear infinite,pulse 1.8s ease-in-out infinite}
.g-gold{background:linear-gradient(180deg,#FFF27A 0%,#FFC93C 50%,#FF9F1C 100%)}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.glowy{animation:glowy 1.2s ease-in-out infinite,popIn .5s cubic-bezier(.2,.9,.3,1.3) both}
a.gbtn,a.gbtn:visited{color:#fff}
a.gbtn.glowy:hover{color:#8FE9FF;filter:none}
.start{margin-top:14px;height:76px;font-size:38px}
.acc{height:66px;font-size:27px}

@keyframes loadfill{from{width:0}to{width:100%}}
@keyframes stripes{from{background-position:0 0}to{background-position:71px 0}}
.loadwrap{position:relative;height:66px;border:4px solid #0E1128;border-radius:20px;background:#1B1F3B;box-shadow:0 8px 0 #0E1128;padding:6px;overflow:hidden}
.loadbar{height:100%;width:0;border-radius:13px;animation:loadfill 2.6s cubic-bezier(.3,.1,.4,1) forwards,stripes .5s linear infinite;background:repeating-linear-gradient(135deg,#FF4FD8 0 10px,#7A5CFF 10px 20px,#4FC3F7 20px 30px,#3BD15A 30px 40px,#FFE14D 40px 50px);box-shadow:inset 0 6px 0 rgba(255,255,255,.35)}
.loadtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:4px;font-family:'Luckiest Guy','Russo One',sans-serif;font-size:26px;letter-spacing:1.5px;-webkit-text-stroke:1.5px #0E1128;text-shadow:0 3px 0 #0E1128}
.hidden{display:none!important}

/* ===== result popup + FX ===== */
@keyframes raysSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes raysSpinRev{to{transform:translate(-50%,-50%) rotate(-360deg)}}
@keyframes glowPulse{0%,100%{transform:translate(-50%,-50%) scale(.85);opacity:.65}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}
@keyframes shock{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(2.8);opacity:0}}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
@keyframes burst{0%{transform:translateY(0) rotate(0) scale(.3);opacity:0}8%{opacity:1}70%{opacity:1}100%{transform:translateY(-210px) rotate(540deg) scale(1);opacity:0}}
@keyframes burstFar{0%{transform:translateY(0) rotate(0) scale(.3);opacity:0}8%{opacity:1}70%{opacity:1}100%{transform:translateY(-300px) rotate(-620deg) scale(1.1);opacity:0}}
@keyframes slam{0%{transform:scale(0) rotate(-25deg)}55%{transform:scale(1.32) rotate(8deg)}75%{transform:scale(.92) rotate(-4deg)}100%{transform:scale(1) rotate(0)}}
@keyframes gotIn{0%{transform:scale(2.4);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.08)}}
@keyframes cardIn{0%{transform:translateY(60px) scale(.7);opacity:0}60%{transform:translateY(-8px) scale(1.04);opacity:1}100%{transform:translateY(0) scale(1)}}
.overlay{position:absolute;inset:0;background:rgba(10,12,30,.72);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}
.fx{position:absolute;left:50%;top:calc(50% - 100px);width:0;height:0;pointer-events:none}
.fx>div{position:absolute;left:0;top:0}
.rays{width:680px;height:680px;border-radius:50%;transform:translate(-50%,-50%);opacity:.6;animation:raysSpin 12s linear infinite;-webkit-mask:radial-gradient(circle,#000 0 14%,transparent 60%);mask:radial-gradient(circle,#000 0 14%,transparent 60%)}
.rays2{width:560px;height:560px;border-radius:50%;transform:translate(-50%,-50%);animation:raysSpinRev 18s linear infinite;background:repeating-conic-gradient(rgba(255,255,255,.4) 0 3deg,transparent 3deg 24deg);-webkit-mask:radial-gradient(circle,#000 0 10%,transparent 55%);mask:radial-gradient(circle,#000 0 10%,transparent 55%)}
.glow{width:340px;height:340px;border-radius:50%;animation:glowPulse 1.6s ease-in-out infinite}
.shock{width:170px;height:170px;border-radius:50%;border:7px solid #fff;animation:shock .9s ease-out both}
.shock.s2{animation-delay:.22s}
.pw{width:0;height:0}
.pt{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border:2px solid #0E1128;border-radius:2px;animation:burst 2.2s cubic-bezier(.15,.7,.3,1) infinite}
.pt.far{width:9px;height:16px;left:-4px;top:-8px;animation-name:burstFar;animation-duration:2.6s}
.result{position:relative;width:310px;background:#1B1F3B;border:4px solid #0E1128;border-radius:20px;padding:18px 20px 22px;text-align:center;overflow:hidden;animation:cardIn .55s cubic-bezier(.2,.9,.3,1.2) both}
.got{display:inline-block;font-family:'Luckiest Guy','Russo One',sans-serif;font-size:40px;line-height:1;color:#FFE14D;-webkit-text-stroke:2px #0E1128;text-shadow:0 4px 0 #0E1128;animation:gotIn .55s cubic-bezier(.2,.9,.3,1.2) both,wiggle 1.4s .55s ease-in-out infinite}
.stage{position:relative;height:190px;display:flex;align-items:center;justify-content:center;margin-top:6px}
.ring{position:absolute;width:160px;height:160px;border:8px dashed;border-radius:14px;opacity:.55;animation-duration:14s}
.stage .tw{position:absolute}
.slam{animation:slam .75s cubic-bezier(.2,.9,.3,1.2) both}
.stage img{display:block;max-width:220px;max-height:176px;object-fit:contain}
.rtype{font-size:12px;font-weight:900;color:#9FB0FF;text-transform:uppercase;letter-spacing:.6px}
.rname{font-family:'Russo One',sans-serif;font-size:24px;line-height:1.1;margin-top:4px}
.pill{display:inline-block;margin-top:10px;padding:5px 14px;border-radius:999px;border:3px solid #0E1128;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.6px}
.claim{margin-top:18px;height:62px;font-size:30px}
.flash{position:absolute;inset:0;background:#fff;pointer-events:none;animation:flash .55s ease-out forwards}

@media (prefers-reduced-motion:reduce){.float,.sway,.drift,.twinkle,.spinslow,.breathe,.pulse,.g-purple,.rays,.rays2,.glow,.pt{animation:none}}
</style>
</head>

var TYPE_NAMES = { egg: 'Egg', pet: 'Pet', trail: 'Trail' };

/* =========================================================
   LOGIC
   ========================================================= */
var W = 358, STRIDE = 124, CARD = 116, STRIP = 70, WIN = 53;
var $ = function (id) { return document.getElementById(id); };
var strip = $('strip');
var timers = [];
var state;

function pick(avoid, weights) {
  avoid = avoid || [];
  for (var tries = 0; tries < 30; tries++) {
    var total = 0, k;
    for (k in RARITIES) total += weights ? weights[k] : RARITIES[k].weight;
    var roll = Math.random() * total, rar = 'rare';
    for (k in RARITIES) { roll -= weights ? weights[k] : RARITIES[k].weight; if (roll <= 0) { rar = k; break; } }
    var list = POOL.filter(function (p) { return p.rarity === rar && avoid.indexOf(p.name) === -1; });
    if (list.length) return list[Math.floor(Math.random() * list.length)];
  }
  var any = POOL.filter(function (p) { return avoid.indexOf(p.name) === -1; });
  return any[Math.floor(Math.random() * any.length)];
}
function offsetFor(i, j) { return Math.round(W / 2 - (i * STRIDE + CARD / 2) + j); }
function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }

function cardHTML(p) {
  var r = RARITIES[p.rarity];
  return '<div class="card" style="border-color:' + r.color + ';box-shadow:inset 0 -7px 0 ' + r.shade + '">' +
    '<div class="pic"><img src="' + p.img + '" alt="' + p.name + '"></div>' +
    '<div><div class="name">' + p.name + '</div><div class="rar" style="color:' + r.text + '">' + r.label + '</div></div></div>';
}
function renderStrip() { strip.innerHTML = state.items.map(cardHTML).join(''); }
function setOffset(px, animate) {
  strip.style.transition = animate ? 'transform ' + SPIN_SECONDS + 's cubic-bezier(0.1, 0.75, 0.15, 1)' : 'none';
  strip.style.transform = 'translateX(' + px + 'px)';
}
function renderStats() {
  $('spins').textContent = state.spins;
  if (state.best) {
    var br = RARITIES[state.best.rarity];
    $('best').textContent = br.label; $('best').style.color = br.text;
  } else {
    $('best').textContent = '—'; $('best').style.color = '#FFFFFF';
  }
  $('empty').style.display = state.history.length ? 'none' : 'block';
  $('hlist').innerHTML = state.history.map(function (p) {
    return '<div class="hitem" style="border-color:' + RARITIES[p.rarity].color + '"><img src="' + p.img + '" alt="">' + p.name + '</div>';
  }).join('');
}
function setAcc(mode) {
  $('getAcc').classList.toggle('hidden', mode !== 'idle');
  $('loading').classList.toggle('hidden', mode !== 'loading');
  $('goAcc').classList.toggle('hidden', mode !== 'ready');
  // restart loading animation each time
  if (mode === 'loading') { var bar = $('loading').querySelector('.loadbar'); bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = ''; }
}

function showResult(p) {
  var r = RARITIES[p.rarity];
  var cols = [r.color, '#FFE14D', '#FFFFFF', '#4FC3F7', '#FF4FD8', '#3BD15A'];
  var parts = '';
  for (var i = 0; i < 24; i++) {
    parts += '<div class="pw" style="transform:rotate(' + (i * 15 + (i % 3) * 4) + 'deg)"><div class="pt' + (i % 2 ? ' far' : '') +
      '" style="background:' + cols[i % cols.length] + ';animation-delay:' + (((i * 7) % 12) * 0.15).toFixed(2) + 's"></div></div>';
  }
  var ov = $('overlay');
  ov.innerHTML =
    '<div class="fx" aria-hidden="true">' +
      '<div class="glow" style="background:radial-gradient(circle,' + r.color + ' 0,rgba(255,255,255,0) 65%)"></div>' +
      '<div class="rays" style="background:repeating-conic-gradient(' + r.color + ' 0 9deg,rgba(255,255,255,0) 9deg 18deg)"></div>' +
      '<div class="rays2"></div><div class="shock"></div><div class="shock s2" style="border-color:' + r.color + '"></div>' + parts +
    '</div>' +
    '<div class="result" style="box-shadow:0 10px 0 #0E1128,0 0 0 4px ' + r.color + ',0 0 50px ' + r.color + '">' +
      '<div class="got">YOU GOT!</div>' +
      '<div class="stage">' +
        '<div class="ring spinslow" style="border-color:' + r.color + '"></div>' +
        '<div class="tw twinkle" style="left:22px;top:26px;width:14px;height:14px;background:#fff"></div>' +
        '<div class="tw twinkle" style="right:26px;top:40px;width:10px;height:10px;background:' + r.color + ';animation-delay:-.8s"></div>' +
        '<div class="tw twinkle" style="left:40px;bottom:22px;width:10px;height:10px;background:' + r.color + ';animation-delay:-1.4s"></div>' +
        '<div class="tw twinkle" style="right:34px;bottom:30px;width:14px;height:14px;background:#fff;animation-delay:-.4s"></div>' +
        '<div class="slam"><div class="float"><img class="egg-shadow" src="' + p.img + '" alt="' + p.name + '"></div></div>' +
      '</div>' +
      '<div class="rtype">' + TYPE_NAMES[p.type] + '</div>' +
      '<div class="rname">' + p.name + '</div>' +
      '<div class="pill" style="background:' + r.color + ';color:' + r.pill + '">' + r.label + '</div>' +
      '<button class="gbtn g-green pulse claim" id="claim"><span class="t">CLAIM</span></button>' +
      '<div class="flash"></div>' +
    '</div>';
  ov.classList.remove('hidden');
  $('claim').addEventListener('click', function () { ov.classList.add('hidden'); ov.innerHTML = ''; });
}

function spin() {
  if (state.spinning) return;
  state.spinning = true;
  $('start').disabled = true; $('startLabel').textContent = 'ROLLING…';

  var next = state.items.slice(state.center - 3, state.center + 4);
  while (next.length < STRIP) next.push(pick([next[next.length - 1].name]));
  var winner = pick([next[WIN - 1].name, next[WIN + 1].name], WIN_WEIGHTS);
  next[WIN] = winner;
  var jitter = Math.round((Math.random() - 0.5) * 90);

  state.items = next;
  renderStrip();
  setOffset(offsetFor(3, state.jitter), false);
  strip.getBoundingClientRect();
  requestAnimationFrame(function () { setOffset(offsetFor(WIN, jitter), true); });

  later(function () {
    state.spinning = false; state.center = WIN; state.jitter = jitter;
    state.spins++;
    if (!state.best || RARITIES[winner.rarity].rank > RARITIES[state.best.rarity].rank) state.best = winner;
    state.history = [winner].concat(state.history).slice(0, 6);
    renderStats();
    $('start').disabled = false; $('startLabel').textContent = 'START';
    showResult(winner);
  }, SPIN_SECONDS * 1000 + 200);
}

function resetAll() {
  timers.forEach(clearTimeout); timers = [];
  var items = [];
  for (var i = 0; i < STRIP; i++) items.push(pick(i ? [items[i - 1].name] : []));
  state = { items: items, center: 3, jitter: 0, spinning: false, spins: 0, best: null, history: [] };
  renderStrip(); setOffset(offsetFor(3, 0), false);
  renderStats(); setAcc('idle');
  $('start').disabled = false; $('startLabel').textContent = 'START';
  $('overlay').classList.add('hidden'); $('overlay').innerHTML = '';
}

$('goAcc').href = ACCOUNT_URL;
$('start').addEventListener('click', spin);
$('reset').addEventListener('click', resetAll);
$('getAcc').addEventListener('click', function () {
  setAcc('loading');
  later(function () { setAcc('ready'); }, LOADING_MS);
});
resetAll();
</script>
</body>
